[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "t-rag"
version = "0.1.0"
description = "Local document knowledge bases with citation-based RAG"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "gradio>=5.9,<6",
  "llama-index-core==0.12.52.post1",
  "llama-index-vector-stores-qdrant==0.4.3",
  "llama-index-embeddings-openai-like==0.2.0",
  "llama-index-retrievers-bm25==0.5.2",
  "qdrant-client==1.18.0",
  "PyYAML>=6.0,<7",
  "markdown-it-py>=3.0,<4",
  "openpyxl>=3.1,<4",
  "pypdf>=5.0,<6",
  "sentence-transformers>=3.0,<4",
  "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
]

[project.scripts]
t-rag = "t_rag.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/t_rag"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
